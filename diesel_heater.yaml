esphome:
  # Names shorter than 2 characters seems to be not working in HA integration
  name: heater-adapter-ble
  build_flags:
    - "-DCORE_DEBUG_LEVEL=2"
    - "-DBOARD_HAS_PSRAM"
    - "-DCONFIG_SPIRAM_MODE_OCT"

  # keep wireguard disabled on boot, as it will not work without a valid connection to the peer
  on_boot:
    - priority: 600
      then:
        - wireguard.disable:

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  #flash_mode: opi
  #flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
      flash_chip: mxic

# Flash parameters set to 0x034f. DOUT
#Flash parameters set to 0x024f. DIO
psram:
  mode: octal
  speed: 80MHZ

# Enable logging
logger:
  #level: INFO

api:

wifi:
  networks:
    - ssid: "teamzub"
      password: "Rayna0324!"
      priority: 2
    - ssid: "510940"
      password: "12436040"
      priority: 1
  on_connect:
    - wireguard.enable:
  on_disconnect:
    - wireguard.disable:

ota:
  platform: esphome

external_components:
  #- source: github://warehog/esphome-diesel-heater-ble@main
  #  refresh: 0s
  #  components: [diesel_heater_ble]
  - source:
      type: local
      path: ../esphome-diesel-heater-ble/components
    components: [diesel_heater_ble]

globals:
  - id: ble_connected
    type: bool
    restore_value: no
    initial_value: 'false'

esp32_ble_tracker:

ble_client:
  - mac_address: 54:6C:50:7D:70:E8
    id: ble_client_id
    on_connect:
      then:
        - logger.log: "BT connected: web enabled"
        #- lambda: |-
        #  diesel_heater_web_server->start();
    on_disconnect:
      then:
        - logger.log: "BT disconnected: web enabled"
        #- lambda: |-
        #  diesel_heater_web_server->stop();


diesel_heater_ble:
  ble_client_id: ble_client_id

climate:
  - platform: diesel_heater_ble
    name: "Climate"
    id: diesel_heater_climate
    external_temperature_timeout: 2h        # time at which it fall back to internal temperature, even while off/idle
    external_temperature_timeout_heating: 15min # time at which it fall back to internal temperature, while actively heating
    external_temperature_fahrenheit: false
    external_stage_gain: 2.0                # levels per degree C
    external_off_error: -0.5                # degrees C (negative error = over temp setpoint)
    external_auto_on_error: 1.0             # degrees C (positive error = under temp setpoint)
    external_min_on_time: 10min             # minimum time to stay on once turned on
    external_min_off_time: 20min            # minimum time to stay off once turned off
    external_overshoot_hold: 3min           # time to hold overshoot before turning off
    external_level_update_interval: 10s     # minimum interval to update level

sensor:
  - platform: homeassistant
    entity_id: sensor.my_external_temperature
    id: my_external_temperature
    filters:
      - debounce: 10s      # adding heartbeat would defeat the timeout safety as it replays the last seen state endlessly
    on_value:
      - lambda: id(diesel_heater_climate).set_external_temperature(x);
  - platform: diesel_heater_ble
    running_state:
      name: "Running State"
      id: running_state
    error_code:
      name: "Error Code"
      id: error_code
    running_step:
      name: "Running Step"
      id: running_step
    altitude:
      name: "Altitude"
      id: altitude
    running_mode:
      name: "Running Mode"
      id: running_mode
    set_level:
      name: "Set Level"
      id: set_level
    set_temp:
      name: "Set Temp"
      id: set_temp
    supply_voltage:
      name: "Supply Voltage"
      id: supply_voltage
    case_temp:
      name: "Case Temp"
      id: case_temp
    cab_temp:
      name: "Cab Temp"
      id: cab_temp
    start_time:
      name: "Start Time"
      id: start_time
    auto_time:
      name: "Auto Time"
      id: auto_time
    run_time:
      name: "Run Time"
      id: run_time
    is_auto:
      name: "Is Auto"
      id: is_auto
    language:
      name: "Language"
      id: language
    temp_offset:
      name: "Temp Offset"
      id: temp_offset
    tank_volume:
      name: "Tank Volume"
      id: tank_volume
    oil_pump_type:
      name: "Oil Pump Type"
      id: oil_pump_type
    rf433_on_off:
      name: "RF433 On Off"
      id: rf433_on_off
    temp_unit:
      name: "Temp Unit"
      id: temp_unit
    altitude_unit:
      name: "Altitude Unit"
      id: altitude_unit
    automatic_heating:
      name: "Automatic Heating"
      id: automatic_heating
    co_sensor:
      name: "CO Sensor"
      id: co_sensor
    co_ppm:
      name: "CO PPM"
      id: co_ppm
  
number:
  - platform: diesel_heater_ble
    power_level:
      name: "Power Level"
      id: power_level
    set_temp:
      name: "Target Temperature"
      id: set_temp_number
  - platform: template
    name: "NTP Sync Interval"
    id: ntp_interval_input
    icon: "mdi:clock-fast"
    entity_category: "config"
    min_value: 1
    max_value: 1440
    step: 1
    initial_value: 15
    unit_of_measurement: "min"
  
    # Restores the last set interval value on device reboot
    optimistic: true
    restore_value: true

    # Whenever you change the slider, this forces ESPHome to update the interval
    on_value:
      then:
        - lambda: |-
            // Convert the slider minutes into milliseconds
            uint32_t interval_ms = (uint32_t)(x * 60.0 * 1000.0);
            
            // Apply it directly to the sntp component
            id(diesel_heater_time).set_update_interval(interval_ms);
            
            ESP_LOGI("sntp", "NTP Update Interval adjusted to %ld ms", interval_ms);

switch:
  - platform: diesel_heater_ble
    power:
      name: "Power"
      id: power_switch

button:
  - platform: diesel_heater_ble
    level_up:
      name: "Level Up"
      id: level_up_button
    level_down:
      name: "Level Down"
      id: level_down_button
    temp_up:
      name: "Temp Up"
      id: temp_up_button
    temp_down:
      name: "Temp Down"
      id: temp_down_button

time:
  id: diesel_heater_time
  platform: sntp
  update_interval: 5min

web_server:
  port: 80
  id: diesel_heater_web_server
  version: 3

udp:
